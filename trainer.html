<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>จดเทรน | Fit Kub Nut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EDF1F5; --card:#FFFFFF; --ink:#0E1B2C; --muted:#52627A; --line:#D3DCE7; --line2:#E4EAF1; --field:#F3F6FA; --bar:#DCE4EE;
--accent:#2450E8; --on-accent:#FFFFFF; --soft:#E3EAFD; --soft-ink:#1D3FC0; --dark:#0E1B2C; --on-dark:#FFFFFF;
--ok:#0E7A56; --ok-bg:#DDF3EA; --ok-ink:#0A5C40; --ok-row:#EAF6F0;
--warn-bg:#FFF1D6; --warn-ink:#8A4B00; --warn-line:#E0A23A; --err:#B42318; --err-bg:#FDE7E4; --err-ink:#8E1B12;
--scrim:rgba(14,27,44,.5); --edge:#B9C5D4;
}
@media (prefers-color-scheme:dark){
:root{
--bg:#0C131E; --card:#152030; --ink:#E8EEF7; --muted:#97A7BE; --line:#26364D; --line2:#1F2D42; --field:#1B293C; --bar:#26364D;
--accent:#6C8CFF; --on-accent:#0A1330; --soft:#1F2E58; --soft-ink:#B3C4FF; --dark:#E8EEF7; --on-dark:#0C131E;
--ok:#3FBF93; --ok-bg:#123A2D; --ok-ink:#9BE3C6; --ok-row:#13302A;
--warn-bg:#3A2D10; --warn-ink:#F2CF8B; --warn-line:#8A6A24; --err:#FF9D90; --err-bg:#3D1F1B; --err-ink:#FFC2BA;
--scrim:rgba(0,0,0,.62); --edge:#3A4D69;
}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%;overflow:hidden}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;height:100dvh;display:flex;position:relative}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane.list{width:100%}
.pane.main{display:none;width:100%}
.app[data-view="session"] .pane.list,.app[data-view="summary"] .pane.list{display:none}
.app[data-view="session"] .pane.main,.app[data-view="summary"] .pane.main{display:flex}
@media (min-width:900px){
.pane.list{width:360px;flex:none;border-right:1px solid var(--line)}
.pane.main{display:flex!important;flex:1}
.app[data-view="session"] .pane.list,.app[data-view="summary"] .pane.list{display:flex}
.back{display:none!important}
}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:max(22px,env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:16px}
.padm.sm{padding-top:max(14px,env(safe-area-inset-top))}
.padm{padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
h1{margin:0;font-size:27px;line-height:1.2;font-weight:700;text-wrap:balance}
.sub{font-size:14px;color:var(--muted)}
.small{font-size:13px}
.tabnum{font-variant-numeric:tabular-nums}
.dbar{display:flex;align-items:center;gap:8px}
.dbar .d{flex:1;min-width:0}
.sq{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:600}
.today{border:0;background:var(--soft);color:var(--soft-ink);border-radius:12px;min-height:46px;padding:0 14px;font-size:14px;font-weight:600}
.grp{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:4px 2px -4px}
.cl{display:flex;flex-direction:column;gap:10px}
.cc{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;min-height:78px;color:var(--ink)}
.cc.on{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.cc .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cc .nm{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.cc .tt{font-size:14px;color:var(--muted)}
.pill{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;white-space:nowrap}
.p-todo{background:var(--soft);color:var(--soft-ink)}
.p-doing{background:var(--warn-bg);color:var(--warn-ink)}
.p-done{background:var(--ok-bg);color:var(--ok-ink)}
.p-off{background:var(--field);color:var(--muted)}
.top{padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.top .r1{display:flex;align-items:center;gap:8px}
.top .r1 .sp{flex:1}
.top .nm{font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.btn-soft{border:0;background:var(--soft);color:var(--soft-ink);border-radius:12px;min-height:44px;padding:0 14px;font-size:15px;font-weight:600}
.btn-line{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-height:44px;padding:0 14px;font-size:14px;font-weight:600}
.prog{display:flex;align-items:center;gap:10px}
.prog .tr{flex:1;height:8px;border-radius:4px;background:var(--bar);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.prog b{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sav{font-size:12px;color:var(--muted)}
.sav.err{color:var(--err);font-weight:600}
.sav button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;padding:6px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.skipped{opacity:.6}
.exh{display:flex;gap:10px;align-items:flex-start}
.exn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exn .t{font-size:17px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.exn .m{font-size:13px;color:var(--muted)}
.exn .m.last{color:var(--soft-ink)}
.chip{min-height:44px;border-radius:12px;font-size:13px;font-weight:700;padding:0 12px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.chip.flag{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;border-radius:14px}
.set.done{background:var(--ok-row)}
.srow{display:flex;align-items:center;gap:6px}
.sno{width:24px;flex:none;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.stp{display:flex;align-items:center;background:var(--field);border-radius:12px;min-width:0}
.stp.w{flex:1.3}
.stp.r{flex:1}
.stp button{flex:none;width:32px;min-height:48px;border:0;background:transparent;font-size:22px;font-weight:600;color:var(--soft-ink);padding:0}
.stp .v{flex:1;min-width:0;position:relative}
.stp .num{display:block;width:100%;min-width:0;text-align:center;border:0;background:transparent;color:var(--ink);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 0 10px;min-height:48px}
.stp .num::placeholder{font-size:12px;font-weight:600;color:var(--muted)}
.stp i{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-style:normal;font-size:10px;line-height:1;color:var(--muted);pointer-events:none}
.chk{flex:none;width:48px;min-height:48px;border-radius:12px;font-size:22px;font-weight:700;border:2px solid var(--edge);background:var(--card);color:var(--muted)}
.set.done .chk{border-color:var(--ok);background:var(--ok);color:#fff}
.srow2{display:flex;align-items:center;gap:6px;padding-left:2px}
.srow2 .lb{font-size:12px;font-weight:600;color:var(--muted);flex:none}
.srow2 .rl{margin-left:4px}
.rpe{flex:1;min-width:0;max-width:48px;min-height:40px;border-radius:10px;font-size:15px;font-weight:700;border:1px solid var(--edge);background:var(--card);color:var(--ink);padding:0}
.rpe.on{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.rest-in{flex:none;width:56px;min-height:40px;border-radius:10px;border:1px solid var(--edge);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.exf{display:flex;flex-wrap:wrap;gap:8px}
.mini{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;padding:0 12px}
.add{min-height:56px;border:2px dashed var(--edge);background:transparent;color:var(--soft-ink);border-radius:16px;font-size:16px;font-weight:700}
.empty{margin:auto;text-align:center;color:var(--muted);padding:32px;display:flex;flex-direction:column;gap:8px;align-items:center}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.45}
.b-info{background:var(--soft);color:var(--soft-ink)}
.b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-ok{background:var(--ok-bg);color:var(--ok-ink)}
.foot{background:var(--card);border-top:1px solid var(--line);padding:10px 16px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.rest{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px}
.rest .lb{font-size:12px;font-weight:600;line-height:1.2}
.rest .tm{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:66px}
.rest .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.rest .bar i{display:block;height:100%;background:#fff}
.rest.over{background:#B45309;color:#fff}
.rest .b1{min-height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:inherit;font-size:14px;font-weight:600;padding:0 12px}
.rest .b2{min-height:44px;border:0;border-radius:10px;background:#fff;color:#1D3FC0;font-size:14px;font-weight:700;padding:0 14px}
.big{min-height:54px;border:0;border-radius:14px;background:var(--dark);color:var(--on-dark);font-size:17px;font-weight:700;width:100%}
.big.blue{background:var(--accent);color:var(--on-accent)}
.big:disabled{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.rows>div{padding:10px 0;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:2px}
.rows>div:last-child{border-bottom:0}
.rows .a{font-size:15px;font-weight:600}
.rows .b{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nfy{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.nfy .row{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.4}
.nfy input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.nfy textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);padding:10px 12px;font:inherit;font-size:15px;resize:vertical}
.nfy .hint{font-size:13px;color:var(--muted);line-height:1.45}
.nfy [hidden]{display:none}
.notes{background:var(--warn-bg);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--warn-ink)}
.notes b{font-size:14px}
.notes div{font-size:14px;line-height:1.45}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sh{background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:86%;overflow-y:auto;width:100%;max-width:560px;margin:0 auto}
@media (min-width:900px){.scrim{justify-content:center;align-items:center}.sh{border-radius:22px;max-height:80%}}
.sh .k{font-size:12px;font-weight:600;color:var(--muted)}
.sh .h{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:44px;border-radius:999px;padding:0 16px;font-size:15px;font-weight:600;border:1px solid var(--edge);background:var(--card);color:var(--ink)}
.tag.on{border-color:var(--err);background:var(--err-bg);color:var(--err-ink)}
.field{min-height:52px;border:1px solid var(--edge);border-radius:12px;padding:0 14px;font-size:16px;color:var(--ink);background:var(--card);width:100%}
.pick{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.pick button{text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--ink);font-size:16px;padding:0 14px;min-height:50px}
.pick button:last-child{border-bottom:0}
.pick button.cust{color:var(--accent);font-weight:700}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.rs-open{width:100%;min-height:54px;border:1px dashed var(--accent);background:var(--soft);color:var(--soft-ink);border-radius:14px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.rs{display:flex;flex-direction:column;gap:14px}
.rs .tag.on{border-color:var(--accent);background:var(--soft);color:var(--soft-ink)}
.rs .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.rs .aps{display:flex;flex-direction:column;gap:8px}
.rs .ap{text-align:left;border:1px solid var(--edge);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;min-height:56px;display:flex;flex-direction:column;gap:2px;font-size:16px;font-weight:700}
.rs .ap small{font-size:13px;font-weight:500;color:var(--muted)}
.rs .ap.on{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.rs .chk2{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.4}
.rs .chk2 input{width:22px;height:22px;margin:0;flex:none}
.rs .chk2 .hint{font-size:13px;color:var(--muted)}
.rs .back2{align-self:flex-start;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:700;min-height:36px;padding:0}
.rs .res{display:flex;flex-direction:column;gap:6px;background:var(--soft);color:var(--soft-ink);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45}
.rs .res s{opacity:.7}
.msg{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.msg .box{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.msg h2{margin:0;font-size:21px;line-height:1.3}
.msg p{margin:0;color:var(--muted);font-size:15px}
.msg code{display:block;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;user-select:all;color:var(--ink)}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--bar);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.prog .tr i{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dark);color:var(--on-dark);border-radius:12px;padding:10px 16px;font-size:14px;z-index:50;max-width:88%;text-align:center}
</style>
</head>
<body>
<div class="app" id="app" data-view="list">
<aside class="pane list" id="pList">
<div class="scroll"><div class="pad" id="listBox"></div></div>
</aside>
<section class="pane main" id="pMain">
<div class="empty" id="mEmpty"><div style="font-size:17px;font-weight:600;color:var(--ink)">เลือกลูกค้าทางซ้าย</div><div class="small">แล้วจดน้ำหนัก จำนวนครั้ง และอาการได้เลย</div></div>
<div id="mSession" style="display:none;flex-direction:column;min-height:0;flex:1"></div>
<div id="mSummary" style="display:none;flex-direction:column;min-height:0;flex:1"></div>
</section>
</div>
<div class="scrim" id="scrim" hidden><div class="sh" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="msg" id="vMsg"><div class="box" id="msgBox"><div class="spin" role="status" aria-label="กำลังโหลด"></div></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script>
var CONFIG = {
LIFF_ID: "2012288678-D28CcUj0",
API_URL: "https://script.google.com/macros/s/AKfycbxgsb7gU-x-0vH3T-WEkLV67DMdI4EloOBxAC-yNpqsCEKpSt1cENGhbMco7ZHGl3ib/exec"
};
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var DEMO = /[?&]demo=1/.test(location.search);
var DOW = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
var MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var TAGS = ["เจ็บเข่า","เจ็บหลังล่าง","เจ็บไหล่","ตึง/ล้ามาก","เวียนหัว","ลดน้ำหนักลง","ข้ามท่านี้"];
var SKIP = "ข้ามท่านี้";
var idToken = "", retried = false;

var view = "list";
var rest = null;                  /* { i, j, total, t0 } */
var saving = false, dirty = false, saveTimer = 0, saveState = "", saveAt = "";
function esc(x){ return String(x == null ? "" : x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function num(v){ if(v === "" || v == null) return 0; var n = Number(String(v).replace(",",".")); return isFinite(n) ? n : 0; }
function fmtN(n){ return String(Math.round(n * 100) / 100); }
function kg(w){ return (!w) ? "ตัวเปล่า" : fmtN(w) + " กก."; }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function isoOf(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function dateOf(iso){ var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(); }
function longDate(iso){ var d = dateOf(iso); return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()] + " " + (d.getFullYear()+543); }
function shortDate(iso){ var d = dateOf(iso); return d.getDate() + " " + MON[d.getMonth()]; }
function nowHM(){ var d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function key(n){ return String(n || "").replace(/^[A-Za-z]\d*\.\s*/,"").replace(/\s+/g," ").trim().toLowerCase(); }
function mmss(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + pad2(s % 60); }

$("vMsg").hidden = false;

var paint = function(){
var q = $("pq").value.trim().toLowerCase(), used = {};
E.ex.forEach(function(e){ used[key(e.n)] = 1; });
var list = S.library.filter(function(n){ return !q || n.toLowerCase().indexOf(q) >= 0; }).slice(0, 80);
var html = "";
if(q && !S.library.some(function(n){ return n.toLowerCase() === q; })) html += '<button type="button" class="cust" data-n="' + esc($("pq").value.trim()) + '">+ ใช้ชื่อ “' + esc($("pq").value.trim()) + '” (พิมพ์เอง)</button>';
list.forEach(function(n){ html += '<button type="button" data-n="' + esc(n) + '">' + esc(n) + (used[key(n)] ? ' <span class="sub small">· มีอยู่แล้ว</span>' : '') + '</button>'; });
if(!html) html = '<div class="sub" style="padding:14px">ไม่พบท่าที่ตรงกัน พิมพ์ชื่อท่าแล้วกดใช้ชื่อที่พิมพ์ได้เลย</div>';
$("pickList").innerHTML = html;
};
paint();
$("pq").oninput = paint;
$("pCancel").onclick = closeSheet;
$("pickList").onclick = function(ev){
var b = ev.target.closest("[data-n]"); if(!b) return;
var name = b.getAttribute("data-n").replace(/\s+/g, " ").trim();
if(!name) return;
closeSheet();
if(mode === "swap"){
var o = E.ex[idx], base = o.src === "swap" ? o.base : o.n;
var ne = newEx({ n:name, ns:o.ns, reps:o.reps, rn:o.rn, ru:o.ru, kg:o.kg, rest:o.rest, src:"swap", base:(o.src === "added" ? "" : base) });
if(o.src === "added") ne.src = "added";
ne.note = o.note; ne.tags = o.tags;
fillSets(ne, idx, null);
E.ex[idx] = ne;
} else {
var ne2 = newEx({ n:name, ns:3, reps:"", rn:"", ru:"ครั้ง", rest:60, src:"added" });
fillSets(ne2, E.ex.length, null);
E.ex.push(ne2);
}
renderSession(); touch(true);
var sc = $("sesScroll"); if(sc && mode === "add") sc.scrollTop = sc.scrollHeight;
};
setTimeout(function(){ try{ $("pq").focus(); }catch(x){} }, 50);
}
function statePayload(){
return { title:E.title, start:E.start, dayNote:E.dayNote, dayTags:E.dayTags,
ex:E.ex.map(function(e){ return { n:e.n, ns:e.ns, reps:e.reps, rn:e.rn, ru:e.ru, kg:e.kg, rest:e.rest, src:e.src, base:e.base, skip:e.tags.indexOf(SKIP) >= 0, note:e.note, tags:e.tags,
sets:e.sets.map(function(s){ return { done:s.done, w:s.w, r:s.r, rpe:s.rpe || "", rest:s.rest }; }) }; }) };
}
function paintSave(){
var el = $("savTxt"); if(!el) return;
if(saveState === "saving") { el.className = "sav"; el.textContent = "กำลังบันทึก…"; }
else if(saveState === "err"){ el.className = "sav err"; el.innerHTML = 'บันทึกไม่สำเร็จ <button type="button" id="savRetry">ลองใหม่</button>'; $("savRetry").onclick = function(){ flushNow(); }; }
else if(saveState === "ok"){ el.className = "sav"; el.textContent = "บันทึกแล้ว " + saveAt; }
else { el.className = "sav"; el.textContent = ""; }
}
function touch(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flushNow, 900); }
function flushNow(){
clearTimeout(saveTimer);
if(!E || !dirty) return Promise.resolve();
if(saving) return Promise.resolve();
dirty = false; saving = true; saveState = "saving"; paintSave();
var snap = E;
return api("trainerSave", { name:snap.name, iso:snap.iso, sid:snap.sid, state:statePayload() }, true).then(function(r){
saving = false;
if(!r.ok){ dirty = true; saveState = "err"; paintSave(); if(r.error !== "busy"){ toast(errMsg(r)); } else { saveTimer = setTimeout(flushNow, 4000); } return; }
snap.sid = r.sid || snap.sid; saveState = "ok"; saveAt = r.savedAt || nowHM();
if(r.finished) snap.status = "จบแล้ว";
markState(snap, r);
if(E === snap) paintSave();
if(dirty) flushNow();
}).catch(function(){ saving = false; dirty = true; saveState = "err"; paintSave(); saveTimer = setTimeout(flushNow, 8000); });
}
function markState(s, r){
var c = S.customers.filter(function(x){ return x.name === s.name; })[0];
if(!c) return;
c.state = (s.status === "จบแล้ว" || r.finished) ? "done" : "doing";
if(r.course){ c.done = r.course.done; if(r.course.total) c.total = r.course.total; }
renderList();
}
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flushNow(); });
window.addEventListener("pagehide", function(){ flushNow(); });
function renderSummary(){
var exDone = 0, sets = 0, vol = 0, rows = "", notes = "";
E.ex.forEach(function(e){
var parts = [], any = false;
e.sets.forEach(function(s){ if(s.done){ any = true; sets++; vol += s.w * s.r; parts.push((s.w ? fmtN(s.w) + " กก." : "ตัวเปล่า") + " × " + fmtN(s.r) + (e.ru === "วิ" ? " วิ" : "") + (s.rpe ? " (RPE " + s.rpe + ")" : "")); } });
if(any) exDone++;
var skip = e.tags.indexOf(SKIP) >= 0;
rows += '<div><div class="a">' + esc(e.n) + (skip ? ' <span class="sub small">· ข้าม</span>' : '') + '</div><div class="b">' + (parts.length ? esc(parts.join("  ·  ")) : "ยังไม่ได้จดเซ็ต") + '</div></div>';
if(e.note || e.tags.length) notes += '<div>' + esc(e.n) + ': ' + esc(e.tags.concat(e.note ? [e.note] : []).join(", ")) + '</div>';
});
if(E.dayNote || E.dayTags.length) notes = '<div>ทั้งวัน: ' + esc(E.dayTags.concat(E.dayNote ? [E.dayNote] : []).join(", ")) + '</div>' + notes;
var h = '<div class="scroll"><div class="padm sm"><div><button type="button" class="btn-soft" id="sBack">‹ กลับไปจดต่อ</button></div>' +
'<div><h1 style="font-size:26px">สรุปก่อนบันทึก</h1><div class="sub">' + esc(E.name) + ' · ' + (E.hasPlan ? esc(E.title) : 'เทรนนอกแผน') + ' · ' + esc(longDate(E.iso)) + '</div></div>' +
'<div class="stats"><div class="stat"><b>' + exDone + '/' + E.ex.length + '</b><span>ท่าที่ทำ</span></div><div class="stat"><b>' + sets + '</b><span>เซ็ตที่จบ</span></div><div class="stat"><b>' + Math.round(vol).toLocaleString("en-US") + '</b><span>ปริมาณรวม กก.</span></div></div>' +
'<div class="rows">' + (rows || '<div><div class="b">ยังไม่มีท่าในวันนี้</div></div>') + '</div>' +
(notes ? '<div class="notes"><b>หมายเหตุและอาการที่จดไว้</b>' + notes + '</div>' : '') +
notifyBlock(!!notes) +
'<div id="sResult"></div></div></div>' +
'<div class="foot"><button type="button" class="big blue" id="sSave">' + (E.status === "จบแล้ว" ? 'บันทึกการแก้ไข' : 'บันทึกลงชีตและจบเทรน') + '</button></div>';
$("mSummary").innerHTML = h;
$("sBack").onclick = function(){ $("mSummary").style.display = "none"; $("mSession").style.display = "flex"; setView("session"); };
$("sSave").onclick = function(){ doFinish(sets === 0, false); };
if($("nfOn")) $("nfOn").onchange = function(){ E.nfOn = this.checked; $("nfBody").hidden = !this.checked; };
if($("nfMsg")) $("nfMsg").oninput = function(){ E.nfMsg = this.value; };
if($("nfNotes")) $("nfNotes").onchange = function(){ E.nfNotes = this.checked; };
if($("nfEnable")) $("nfEnable").onclick = function(){ setNotify(true); };
if($("nfOff")) $("nfOff").onclick = function(){ setNotify(false); };
if(E.result) showResult(E.result);
}
function notifyBlock(hasNotes){
if(E.status === "จบแล้ว") return "";
if(NOTIFY.on){
var q = (NOTIFY.left !== null && NOTIFY.left !== undefined) ? "โควตาไลน์เหลือ " + NOTIFY.left + (NOTIFY.limit ? " จาก " + NOTIFY.limit : "") + " ข้อความเดือนนี้" : "";
var on = E.nfOn !== false;
return '<div class="nfy" id="nfy"><label class="row"><input type="checkbox" id="nfOn"' + (on ? ' checked' : '') + '><span><b>แจ้งลูกค้าทางไลน์</b><br><span class="hint">ส่งการ์ดสรุปให้ ' + esc(E.name) + ' ทันทีที่บันทึก ลูกค้าไม่ต้องกดอะไร</span></span></label>' +
'<div id="nfBody"' + (on ? '' : ' hidden') + ' style="display:flex;flex-direction:column;gap:10px">' +
'<textarea id="nfMsg" maxlength="200" placeholder="ข้อความถึงลูกค้า (ไม่ใส่ก็ได้) เช่น วันนี้ทำได้ดีมากครับ">' + esc(E.nfMsg || "") + '</textarea>' +
(hasNotes ? '<label class="row"><input type="checkbox" id="nfNotes"' + (E.nfNotes ? ' checked' : '') + '><span>แนบหมายเหตุและอาการที่จดไว้ด้วย<br><span class="hint">ปกติไม่ส่ง เก็บไว้ให้ณัฒดูเองเท่านั้น</span></span></label>' : '') +
'</div><div class="hint">' + q + '</div><div><button type="button" class="btn-line" id="nfOff">ปิดระบบแจ้งลูกค้า</button></div></div>';
}
return '<div class="nfy" id="nfy"><div class="hint"><b>การแจ้งลูกค้าทางไลน์ปิดอยู่</b><br>ปิดไว้เพื่อประหยัดโควตาข้อความไลน์' + ((NOTIFY.left !== null && NOTIFY.left !== undefined) ? " (เหลือ " + NOTIFY.left + (NOTIFY.limit ? " จาก " + NOTIFY.limit : "") + " ข้อความเดือนนี้)" : "") + ' เปิดเมื่อพร้อมให้ระบบส่งการ์ดหาลูกค้าทุกครั้งที่จบเทรน</div><div><button type="button" class="btn-line" id="nfEnable">เปิดการแจ้งลูกค้า</button></div></div>';
}
function setNotify(on){
api("trainerNotifySet", { on:on }).then(function(r){
if(r && r.ok && r.notify){ NOTIFY = r.notify; renderSummary(); toast(on ? "เปิดการแจ้งลูกค้าแล้ว" : "ปิดการแจ้งลูกค้าแล้ว"); }
else toast(errMsg(r || {}));
}).catch(function(){ toast("เชื่อมต่อไม่ได้ ลองอีกครั้งนะครับ"); });
}
function doFinish(empty, force){
if(empty && !force){
return openConfirm("ยังไม่ได้จดเซ็ตเลย", "จบเทรนโดยไม่มีข้อมูลเซ็ต ระบบจะนับเป็น 1 ครั้งในคอร์สตามปกติ ต้องการจบเลยไหม", "จบเลย", function(){ doFinish(true, true); });
}
var btn = $("sSave"); btn.disabled = true; btn.textContent = "กำลังบันทึก…";
var wait = function(n){ if(saving && n < 40) return new Promise(function(res){ setTimeout(res, 250); }).then(function(){ return wait(n+1); }); return Promise.resolve(); };
wait(0).then(function(){
dirty = false; clearTimeout(saveTimer);
return api("trainerFinish", { name:E.name, iso:E.iso, sid:E.sid, state:statePayload(), force:!!force, wasDone:E.status === "จบแล้ว", notify:!!(NOTIFY.on && E.nfOn !== false && E.status !== "จบแล้ว"), notifyMsg:E.nfMsg || "", notifyNotes:!!E.nfNotes });
}).then(function(r){
if(!r.ok){
btn.disabled = false; btn.textContent = "บันทึกลงชีตและจบเทรน"; dirty = true;
return toast(errMsg(r));
}
E.status = "จบแล้ว"; E.sid = r.sid || E.sid; E.result = r; saveState = "ok"; saveAt = r.savedAt || nowHM();
markState(E, r);
btn.hidden = true;
var nb = $("nfy"); if(nb) nb.style.display = "none";
if(r.notify && r.notify.sent && NOTIFY.left !== null && NOTIFY.left !== undefined) NOTIFY.left--;
showResult(r);
}).catch(function(){
btn.disabled = false; btn.textContent = "บันทึกลงชีตและจบเทรน"; dirty = true;
toast("เชื่อมต่อไม่ได้ ข้อมูลยังอยู่ในหน้านี้ กดบันทึกอีกครั้งได้เลย");
});
}
function showResult(r){
var led = r.ledger, good = (led === "marked" || led === "created" || led === "already" || led === "");
var c = r.course, txt;
if(good){
txt = (led === "already" || led === "") ? "แก้ไขข้อมูลเรียบร้อย นับในคอร์สไว้ก่อนแล้ว" : "นับเป็น 1 ครั้งในคอร์สให้แล้ว";
if(c) txt += " (เทรนแล้ว " + c.done + (c.total ? " จาก " + c.total : "") + " ครั้ง)";
if(led === "created" && !E.hasPlan) txt += " · วันนี้ไม่มีโปรแกรมในชีต ระบบเพิ่มแถว “เทรนแล้ว” ในแท็บนัดหมายให้ ถ้านี่คือการเลื่อนจากนัดอื่น ให้ตรวจแท็บนัดหมายอีกครั้ง";
} else {
txt = "บันทึกข้อมูลเซ็ตแล้ว แต่นับคอร์สไม่สำเร็จ (" + led + ") ลองตรวจในแท็บนัดหมาย";
}
var nt = (r.notify && r.notify.text) ? '<br>' + (r.notify.sent ? '✓ ' : '') + esc(r.notify.text) : '';
$("sResult").innerHTML = '<div class="banner ' + (good ? 'b-ok' : 'b-warn') + '" role="status"><b>บันทึกลงชีตแล้ว</b><br>' + esc(txt) + nt + '</div><div style="height:12px"></div><button type="button" class="big blue" id="sList">กลับไปรายชื่อลูกค้า</button>';
$("sList").onclick = function(){ E = null; $("mSummary").style.display = "none"; $("mEmpty").style.display = "flex"; setView("list"); renderList(); };
var sv = $("sSave"); if(sv) sv.hidden = true;
}
boot();
})();
</script>
</body>
</html>
