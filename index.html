<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ส่งค่าร่างกาย | Fit Kub Nut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F4; --ink:#16241F; --muted:#5B6D63; --card:#FFFFFF; --line:#D8E3DB; --soft:#E3EEE7;
  --accent:#17806A; --on-accent:#FFFFFF; --warn-bg:#FFF1CC; --warn-ink:#6F5300; --err:#B3382C; --err-bg:#FBE4DF;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1914; --ink:#E7F1EB; --muted:#9BB0A4; --card:#16231D; --line:#273A31; --soft:#1D2E26;
    --accent:#3FB899; --on-accent:#07261D; --warn-bg:#3A2F10; --warn-ink:#EDD38A; --err:#FF9D90; --err-bg:#3A1F1B;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.brand b{color:var(--accent);font-weight:600}
h1{font-size:23px;line-height:1.3;margin:2px 0 0;font-weight:700;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid>div{min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.in{display:flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px}
.in:focus-within{border-color:var(--accent);outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.in.bad{border-color:var(--err)}
.in input{flex:1;min-width:0;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:20px;font-weight:600;padding:2px 0;outline:none}
.in input::placeholder{color:var(--muted);font-weight:400;opacity:.7}
.in span{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:3px;min-height:18px}
.hint.e{color:var(--err)}
.prev{font-size:13px;color:var(--muted)}
.prev b{color:var(--ink);font-weight:600}
.btn{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;font-size:16px;padding:13px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:9px 13px;font-size:13px}
.err{background:var(--err-bg);color:var(--err);border-radius:14px;padding:9px 13px;font-size:13px}
.center{text-align:center;padding:36px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.ok{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.ok svg{width:32px;height:32px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .card{padding:11px 13px}
.cmp small{display:block;color:var(--muted);font-size:12px}
.cmp strong{font-size:22px;font-weight:600}
.cmp strong i{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}
.cmp .d{font-size:12px;color:var(--accent);font-weight:500;min-height:18px}
.cmp svg{width:100%;height:34px;margin-top:4px;display:block}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:14px}

.lbrow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:24px;margin-bottom:4px}
.lbrow label{margin:0}
.tip{position:relative;flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft);color:var(--accent);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tip::before{content:"";position:absolute;inset:-10px}
.tip svg{width:14px;height:14px}
.tip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(6,14,10,.55);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:500px;margin:0 auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  max-height:84vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 6px 18px}
.sh-head h2{margin:0;font-size:19px;line-height:1.3;font-weight:700}
.sh-x{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font:inherit;font-size:18px;line-height:1;cursor:pointer}
.sh-x:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 18px 18px;font-size:14px}
.sh-body .lead{margin:0 0 4px;color:var(--ink)}
.sh-body h3{font-size:14px;font-weight:600;margin:16px 0 4px;color:var(--accent)}
.sh-body p{margin:0 0 6px}
.sh-body ul{margin:4px 0 6px;padding-left:20px}
.sh-body li{margin:2px 0}
.sh-body .soft{background:var(--soft);border-radius:12px;padding:9px 12px;margin:8px 0}
.sh-body table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.sh-body th,.sh-body td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.sh-body th{color:var(--muted);font-weight:500;font-size:12px}
.sh-body td:not(:first-child),.sh-body th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bx{border:1px dashed var(--line);border-radius:14px;padding:11px 12px;margin:8px 0}.bx b{font-weight:600;display:block;margin-bottom:8px}.links{display:flex;gap:8px;flex-wrap:wrap}.lk{border:0;border-radius:12px;background:var(--soft);color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer}a.lk{text-decoration:none;display:inline-block}.lk.main{background:var(--accent);color:var(--on-accent)}.lk:disabled{opacity:.7;cursor:default}.lk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.more{margin-top:14px}
.opt{font-weight:400;color:var(--muted)}
.pick{width:100%;border:1.5px dashed var(--line);background:var(--card);color:var(--accent);font:inherit;font-weight:600;font-size:14px;border-radius:14px;padding:13px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.pick svg{width:20px;height:20px}
.pick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pick[hidden],.pv[hidden]{display:none}
.pv{display:flex;gap:12px;align-items:center}
.pv img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;background:var(--soft)}
.src{margin-top:14px;font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="brand"><span><b>Fit Kub Nut</b> · ส่งค่าร่างกาย</span><span id="who"></span></div>

  <section id="vLoad" class="center"><div class="spin" aria-hidden="true"></div><div id="loadTxt">กำลังเปิดหน้า…</div></section>

  <section id="vMsg" hidden class="center">
    <h1 id="msgH"></h1>
    <p class="sub" id="msgP"></p>
    <button class="btn ghost" id="msgBtn" hidden></button>
  </section>

  <section id="vForm" hidden style="display:flex;flex-direction:column;gap:14px">
    <div>
      <h1 id="hello">สวัสดีครับ</h1>
      <p class="sub" id="round"></p>
    </div>
    <div class="note" id="sentBefore" hidden></div>
    <form id="f" novalidate class="card" style="display:flex;flex-direction:column;gap:14px">
      <div class="grid">
        <div><div class="lbrow"><label for="weight">น้ำหนัก</label><button type="button" class="tip" data-tip="weight" aria-label="ประโยชน์ของค่าน้ำหนัก"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><circle cx="12" cy="6.5" r=".6" fill="currentColor"/></svg></button></div><div class="in" id="w-weight"><input id="weight" inputmode="decimal" autocomplete="off" placeholder="0.0"><span>กก.</span></div><div class="hint" id="h-weight"></div></div>
        <div><div class="lbrow"><label for="fat">เปอร์เซ็นต์ไขมัน</label><button type="button" class="tip" data-tip="fat" aria-label="วิธีดูค่าเปอร์เซ็นต์ไขมัน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><circle cx="12" cy="6.5" r=".6" fill="currentColor"/></svg></button></div><div class="in" id="w-fat"><input id="fat" inputmode="decimal" autocomplete="off" placeholder="0.0"><span>%</span></div><div class="hint" id="h-fat"></div></div>
        <div><div class="lbrow"><label for="muscle">มวลกล้ามเนื้อ</label><button type="button" class="tip" data-tip="muscle" aria-label="วิธีดูค่ามวลกล้ามเนื้อ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><circle cx="12" cy="6.5" r=".6" fill="currentColor"/></svg></button></div><div class="in" id="w-muscle"><input id="muscle" inputmode="decimal" autocomplete="off" placeholder="0.0"><span>กก.</span></div><div class="hint" id="h-muscle"></div></div>
        <div><div class="lbrow"><label for="visceral">ไขมันช่องท้อง</label><button type="button" class="tip" data-tip="visceral" aria-label="วิธีดูค่าไขมันช่องท้อง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"/><circle cx="12" cy="6.5" r=".6" fill="currentColor"/></svg></button></div><div class="in" id="w-visceral"><input id="visceral" inputmode="decimal" autocomplete="off" placeholder="0"><span>ระดับ</span></div><div class="hint" id="h-visceral"></div></div>
      </div>
      <div id="photoBox">
        <div class="lbrow"><label for="photo">รูป Check หุ่น <span class="opt" id="photoOpt">(ไม่บังคับ แต่ช่วยให้เห็นความเปลี่ยนแปลงชัดขึ้น)</span></label></div>
        <input id="photo" type="file" accept="image/*" hidden>
        <button type="button" class="pick" id="pickBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>ถ่ายรูป / เลือกรูป</button>
        <div class="pv" id="pv" hidden><img id="photoImg" alt="รูปที่เลือกไว้"><button type="button" class="lk" id="photoDel">เอารูปออก</button></div>
        <div class="hint" id="h-photo"></div>
      </div>
      <div class="err" id="formErr" hidden role="alert"></div>
      <button class="btn" id="submit" type="submit">ส่งค่าร่างกาย</button>
    </form>
    <p class="sub" style="font-size:13px">ยังไม่สะดวกถ่ายรูปตอนนี้ ข้ามไปก่อนได้เลยครับ ส่งรูปมาในแชททีหลังก็ได้ ไม่ต้องเป๊ะ ทำตามสบายนะ</p>
    <section id="scaleSec" class="card" hidden style="display:none;flex-direction:column;gap:6px"></section>
  </section>

  <section id="vDone" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="center" style="padding:14px 8px 0">
      <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h1 id="doneH">ส่งเรียบร้อยครับ</h1>
      <p class="sub" id="doneP"></p>
      <p class="sub" id="doneP2" style="font-size:13px"></p>
    </div>
    <div class="cmp" id="cmp"></div>
    <div class="quote">ค่อยๆ ไปทีละนิด ไม่ต้องรีบนะครับ — Trainer ณัฒ</div>
    <a class="btn ghost" href="overview.html" style="display:block;text-align:center;text-decoration:none">ดูภาพรวมของฉัน</a>
    <button class="btn" id="closeBtn">กลับไปที่แชท</button>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" hidden>
  <div class="sh-head"><h2 id="shT"></h2><button type="button" class="sh-x" id="shX" aria-label="ปิด">✕</button></div>
  <div class="sh-body" id="shB"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script>
/* ===== ตั้งค่า (ณัฒ/ผู้ดูแลแก้เฉพาะ 2 บรรทัดนี้) ===== */
var CONFIG = {
  LIFF_ID: "2012288678-D28CcUj0",
  API_URL: "https://script.google.com/macros/s/AKfycbxgsb7gU-x-0vH3T-WEkLV67DMdI4EloOBxAC-yNpqsCEKpSt1cENGhbMco7ZHGl3ib/exec",
  /* true = บังคับใส่รูปทุกครั้งเหมือนฟอร์มเดิม / false = ไม่บังคับ (ค่าเริ่มต้น) */
  PHOTO_REQUIRED: false,
  /* เครื่องชั่งที่ณัฒใช้ — ใส่ชื่อรุ่น (ไม่ใส่ก็ได้) และลิงก์ ช่องไหนเว้นว่างไว้ ปุ่มนั้นจะไม่ขึ้น ถ้าเว้นว่างทั้งหมด ปุ่ม "ดูเครื่องชั่ง" จะไม่ขึ้นเลย */
  SCALE: {
    name: "",
    shopee: "https://s.shopee.co.th/3VlZyz6mzY?share_channel_code=6",
    tiktok: "https://vt.tiktok.com/ZS9ywsUxw2vkF-PQLwd/",
    lazada: ""
  }
};
/* ================================================== */

(function(){
  /* ปุ่ม "ภาพรวม" ในเมนูใช้ลิงก์เดียวกัน ต่อท้าย ?page=overview แล้วพามาที่หน้าภาพรวม */
  if(/[?&]page=overview(&|$)/.test(location.search)){ location.replace("overview.html"+(/[?&]demo=1/.test(location.search)?"?demo=1":"")); return; }
  if(/[?&]page=meal(&|$)/.test(location.search)){ location.replace("meal.html"+(/[?&]demo=1/.test(location.search)?"?demo=1":"")); return; }
  if(/[?&]page=course(&|$)/.test(location.search)){ location.replace("course.html"+(/[?&]demo=1/.test(location.search)?"?demo=1":"")); return; }
  if(/[?&]page=program(&|$)/.test(location.search)){ location.replace("program.html"+(/[?&]demo=1/.test(location.search)?"?demo=1":"")); return; }
  if(/[?&]page=trainer(&|$)/.test(location.search)){ location.replace("trainer.html"+(/[?&]demo=1/.test(location.search)?"?demo=1":"")); return; }
  if(/[?&]page=reschedule(&|$)/.test(location.search)){ location.replace("trainer.html?go=resched"+(/[?&]demo=1/.test(location.search)?"&demo=1":"")); return; }
  if(/[?&]page=tsummary(&|$)/.test(location.search)){ location.replace("report.html?v=summary"+(/[?&]demo=1/.test(location.search)?"&demo=1":"")); return; }
  if(/[?&]page=tcourses(&|$)/.test(location.search)){ location.replace("report.html?v=courses"+(/[?&]demo=1/.test(location.search)?"&demo=1":"")); return; }
  var $ = function(id){ return document.getElementById(id); };
  var DEMO = /[?&]demo=1/.test(location.search);
  var idToken = "";
  var state = { prev: null };
  var FIELDS = [
    {k:"weight",  name:"น้ำหนัก",          unit:"กก.",  min:20, max:300, dec:1},
    {k:"fat",     name:"ไขมัน",            unit:"%",    min:3,  max:70,  dec:1},
    {k:"muscle",  name:"มวลกล้ามเนื้อ",     unit:"กก.",  min:5,  max:150, dec:1},
    {k:"visceral",name:"ไขมันช่องท้อง",     unit:"",     min:1,  max:60,  dec:1}
  ];

  function show(id){
    ["vLoad","vMsg","vForm","vDone"].forEach(function(v){
      var el=$(v); el.hidden = (v!==id);
      if(v==="vForm"||v==="vDone") el.style.display = (v===id)?"flex":"none";
    });
    window.scrollTo(0,0);
  }
  function msg(h,p,btn){
    $("msgH").textContent=h; $("msgP").textContent=p||"";
    var b=$("msgBtn");
    if(btn){ b.hidden=false; b.textContent=btn.text; b.onclick=btn.fn; } else { b.hidden=true; }
    show("vMsg");
  }
  function fmt(n){ return (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,""); }
  function num(s){ s=String(s||"").replace(/,/g,".").trim(); if(s==="") return null; var n=Number(s); return isNaN(n)?null:n; }

  /* ---------- API ---------- */
  function api(payload){
    if(DEMO) return demoApi(payload);
    payload.idToken = idToken;
    return fetch(CONFIG.API_URL + (CONFIG.API_URL.indexOf("?")>-1?"&":"?") + "liff=1", {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow"
    }).then(function(r){ return r.json(); });
  }
  function demoApi(p){
    return new Promise(function(res){
      setTimeout(function(){
        var hist=[{d:"4 ต.ค.",weight:64.8,fat:30.6,muscle:24.1,visceral:7},{d:"11 ต.ค.",weight:63.4,fat:29.9,muscle:24.4,visceral:6}];
        if(p.action==="bodyInit") return res({ok:true,name:"คุณเมย์",count:2,last:hist[1],history:hist,sentThisWeek:""});
        var v=p.values; var h2=hist.concat([{d:"18 ต.ค.",weight:v.weight,fat:v.fat,muscle:v.muscle,visceral:v.visceral}]);
        res({ok:true,name:"คุณเมย์",prev:hist[1],now:h2[2],history:h2});
      },500);
    });
  }

  /* ---------- boot ---------- */
  function boot(){
    show("vLoad");
    if(DEMO){ return afterAuth(); }
    if(CONFIG.LIFF_ID.indexOf("__")===0 || CONFIG.API_URL.indexOf("__")===0){
      return msg("ยังตั้งค่าไม่ครบ","ผู้ดูแลต้องใส่ LIFF ID และ API URL ในไฟล์หน้านี้ก่อนครับ");
    }
    if(!window.liff){ return setTimeout(boot,150); }
    liff.init({liffId:CONFIG.LIFF_ID}).then(function(){
      if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
      idToken = liff.getIDToken();
      afterAuth();
    }).catch(function(e){
      msg("เปิดหน้านี้ไม่สำเร็จ","ลองปิดแล้วกดปุ่มจากเมนูในแชทใหม่อีกครั้งนะครับ ("+(e&&e.code?e.code:"liff")+")",{text:"ลองอีกครั้ง",fn:function(){location.reload();}});
    });
  }
  var retried=false;
  function afterAuth(){
    $("loadTxt").textContent="กำลังดึงข้อมูลล่าสุดของคุณ…";
    api({action:"bodyInit"}).then(function(r){
      if(!r.ok){
        if(r.error==="token" && !retried && window.liff){ retried=true; liff.logout(); liff.login({redirectUri:location.href}); return; }
        if(r.error==="nomatch") return msg("ยังไม่พบข้อมูลของคุณในระบบ","ทักแชทบอกณัฒได้เลยครับ เดี๋ยวณัฒจับคู่ให้");

      else if(n<f.min||n>f.max){ ok=false; w.classList.add("bad"); h.className="hint e"; h.textContent="ลองเช็กอีกที (ช่วง "+f.min+"–"+f.max+")"; first=first||f.k; }

        var d=c.toDataURL("image/jpeg",0.8);

  function spark(pts){
    if(pts.length<2) return "";
    var w=100,h=34,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),rg=(mx-mn)||1;
    var xs=pts.map(function(p,i){return [(i/(pts.length-1))*(w-8)+4, h-5-((p-mn)/rg)*(h-10)];});
    var line=xs.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
    var l=xs[xs.length-1];
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><polygon points="4,'+h+' '+line+' '+(w-4)+','+h+'" fill="var(--soft)"/><polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="3" fill="var(--accent)"/></svg>';
  }

      if(pv!=null&&pv!==""){
        var diff=Math.round((cur-pv)*10)/10;
        d = diff===0 ? "เท่าเดิม" : (diff<0?"ลดลงจาก ":"เพิ่มขึ้นจาก ")+fmt(pv);

      var pts=(r.history||[]).map(function(x){return x[f.k];}).filter(function(v){return v!=null&&v!=="";}).map(Number);

      +'<p style="margin:0;font-size:14px">'+(SC.name?('เครื่องที่ Fit Kub Nut ใช้เป็นประจำวัดองค์ประกอบร่างกายคือ <b>'+esc(SC.name)+'</b>'):'เครื่องชั่งที่ Fit Kub Nut ใช้เป็นประจำในการวัดองค์ประกอบร่างกาย ซื้อได้จากลิงก์ด้านล่าง')+'</p>'
      +'<p style="margin:0;font-size:14px;color:var(--muted)">ถ้าอยากเห็นกราฟของตัวเองทุกสัปดาห์ เลือกเครื่องที่แสดงครบ 4 ค่า คือ น้ำหนัก เปอร์เซ็นต์ไขมัน มวลกล้ามเนื้อ และไขมันช่องท้อง เครื่องที่มีมือจับหรือขั้วมากกว่าแค่แผ่นเหยียบ มักแม่นกว่า ไม่ต้องแพงที่สุดก็พอ</p>'
      +'<div class="links" style="margin-top:6px">'+scaleLinks()+'</div>'
      +'<p style="margin:6px 0 0;font-size:12px;color:var(--muted)">ยังไม่มีก็ไม่เป็นไรครับ ทักแชทบอกณัฒได้เลย</p>';
    sec.hidden=false; sec.style.display="flex";
  })();

  boot();
})();
</script>
