<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>ต่อคอร์ส / ลูกค้าใหม่ | Fit Kub Nut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F4EEE2; --card:#FFFCF6; --ink:#141414; --muted:#5E5648; --line:#E2D8C3; --field:#F8F3E8;
--accent:#168046; --on-accent:#FFFFFF; --soft:#E2F2E8; --soft-ink:#0F5F34;
--chip:#F2C230; --on-chip:#141414; --dark:#141414; --on-dark:#FFFFFF;
--warn-bg:#FFF1CC; --warn-ink:#6F5300; --err:#B3382C; --err-bg:#FBE4DF; --scrim:rgba(20,16,8,.55);
}
@media (prefers-color-scheme:dark){
:root{
--bg:#11140F; --card:#1B1F18; --ink:#F1ECDF; --muted:#A9A290; --line:#2D3328; --field:#232820;
--accent:#46C98A; --on-accent:#06240F; --soft:#173325; --soft-ink:#A6E8C6;
--chip:#F2C230; --on-chip:#141414; --dark:#F1ECDF; --on-dark:#11140F;
--warn-bg:#3A2F10; --warn-ink:#EDD38A; --err:#FF9D90; --err-bg:#3A1F1B; --scrim:rgba(0,0,0,.65);
}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%;
padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
button,input,select{font-family:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{color:var(--accent);font-weight:600}
h1{font-size:25px;line-height:1.25;margin:2px 0 0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.big{width:100%;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;padding:15px 16px}
.big:disabled{opacity:.5;cursor:default}
.big.dark{background:var(--dark);color:var(--on-dark)}
.big.soft{background:var(--soft);color:var(--soft-ink)}
.sm{border:0;border-radius:12px;background:var(--field);color:var(--ink);font-size:14px;font-weight:500;padding:9px 13px;border:1px solid var(--line)}
.sm.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sm.dng{color:var(--err)}
.chip{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600;background:var(--soft);color:var(--soft-ink);white-space:nowrap}
.chip.y{background:var(--chip);color:var(--on-chip)}
.chip.g{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 13px;font-size:13px}
.err{background:var(--err-bg);color:var(--err);border-radius:14px;padding:10px 13px;font-size:13px}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin:6px 2px -6px}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 15px;color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt:disabled{opacity:.5}
.opt .t{font-size:16px;font-weight:600}
.opt .s{font-size:13px;color:var(--muted)}
.opt .pr{margin-left:auto;text-align:right;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--dark);color:var(--on-dark);display:flex;align-items:center;justify-content:center}
.ico svg{width:24px;height:24px}
.ico.g{background:var(--accent);color:var(--on-accent)}
.in{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 13px;font-size:16px}
select.in{appearance:auto}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 0;font-size:14px;font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.sum{border:1.5px dashed var(--line);border-radius:18px;padding:12px 15px;display:flex;flex-direction:column;gap:2px}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.sum .tot b{font-size:24px;font-variant-numeric:tabular-nums}
.center{text-align:center;padding:30px 8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.okc{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.okc svg{width:32px;height:32px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.pay{white-space:pre-wrap;font-size:16px;font-weight:600;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ord{display:flex;flex-direction:column;gap:9px}
.ord .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ord .nm{font-weight:600;font-size:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:500px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom));background:var(--dark);color:var(--on-dark);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.back{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 0;text-align:left}
.sched{font-size:13px;color:var(--muted)}
.search{margin-bottom:2px}
</style>
</head>
<body>
<main id="root"><div class="center"><div class="spin" role="status" aria-label="กำลังโหลด"></div></div></main>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script>
var CONFIG = {
LIFF_ID: "2012288678-D28CcUj0",
API_URL: "https://script.google.com/macros/s/AKfycbxgsb7gU-x-0vH3T-WEkLV67DMdI4EloOBxAC-yNpqsCEKpSt1cENGhbMco7ZHGl3ib/exec"
};
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
var DEMO = /[?&]demo=1/.test(location.search);
var DEMO_ROLE = /[?&]role=customer/.test(location.search) ? "customer" : "trainer";
var DOW = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
var DSH = ["อา","จ","อ","พ","พฤ","ศ","ส"];
var DORDER = [1,2,3,4,5,6,0];
var MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var idToken = "", retried = false;
var S = null;                       /* ข้อมูลจากหลังบ้าน */
var W = null;                       /* ฟอร์มที่กำลังทำ */
var step = "list";
var busy = false;
var ORDER_ID = (location.search.match(/[?&]o=([\w-]+)/) || [])[1] || "";

function esc(x){ return String(x == null ? "" : x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function isoOf(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function dateOf(iso){ var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(); }
function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function longDate(d){ return DOW[d.getDay()] + "ที่ " + d.getDate() + " " + MON[d.getMonth()]; }
function money(n){ return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function cid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
var toastT = 0;
function toast(t){ var el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ el.hidden = true; }, 2800); }
function api(action, values){
if(DEMO) return demoApi(action, values || {});
var payload = { action: action, values: values || {}, idToken: idToken };
var opt = { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload), redirect:"follow" };
return fetch(CONFIG.API_URL + (CONFIG.API_URL.indexOf("?")>-1?"&":"?") + "liff=1", opt).then(function(r){ return r.json(); });
}
function errMsg(r){
var e = r && r.error;
if(e === "msg") return r.msg;
if(e === "busy") return "ระบบกำลังยุ่งอยู่ ลองอีกครั้งในอึดใจนะครับ";
if(e === "token") return "การล็อกอินหมดอายุ ปิดแล้วเปิดใหม่อีกครั้ง";
if(e === "nomatch") return "ไม่พบรายการนี้ (อาจถูกยกเลิกไปแล้ว) ลองเปิดหน้านี้ใหม่นะครับ";
if(e === "notTrainer") return "บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้";
return "ทำรายการไม่สำเร็จ (" + (e || "unknown") + ")";
}
var SVG = {
renew:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>',
person:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.8 3.6-5.6 7-5.6s6.2 1.8 7 5.6"/><path d="M19 3v4M17 5h4"/></svg>',
hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M10 18.5h4"/></svg>',
send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

/* ---------- เริ่มต้น ---------- */
function boot(){
if(DEMO) return init();
if(!window.liff){ return setTimeout(boot, 150); }
liff.init({ liffId: CONFIG.LIFF_ID }).then(function(){
if(!liff.isLoggedIn()){ liff.login({ redirectUri: location.href }); return; }
idToken = liff.getIDToken();
init();
}).catch(function(e){ fail("เปิดหน้านี้ไม่สำเร็จ", "ลองปิดแล้วเปิดลิงก์ใหม่อีกครั้งนะครับ (" + (e && e.code ? e.code : "liff") + ")"); });
}
function fail(h, p){
$("root").innerHTML = '<div class="center"><h2>' + esc(h) + '</h2><p class="sub">' + esc(p) + '</p><button class="big" type="button" onclick="location.reload()">ลองอีกครั้ง</button></div>';
}
function init(){
api("enrollInit", { o: ORDER_ID }).then(function(r){
if(!r.ok){
if(r.error === "token" && !retried && window.liff){ retried = true; liff.logout(); liff.login({ redirectUri: location.href }); return; }
return fail("มีบางอย่างติดขัด", errMsg(r));
}
S = r; step = "list"; W = null; render();
}).catch(function(){ fail("เชื่อมต่อไม่ได้", "เช็กอินเทอร์เน็ตแล้วลองอีกครั้งนะครับ"); });
}
function render(){
if(!S) return;
var h = "";
if(S.role === "trainer") h = step === "list" ? vTrainerList() : vWizard();
else if(S.role === "trainer-view") h = vTrainerView();
else h = vCustomer();
$("root").innerHTML = h;
}

/* ---------- ชิ้นส่วนที่ใช้ซ้ำ ---------- */
function brand(txt){ return '<div class="brand"><span><b>Fit กับณัฒ</b> · ' + esc(txt) + '</span></div>'; }
function stChip(st){
if(st === "รอโอน") return '<span class="chip y">รอโอน</span>';
if(st === "รอลูกค้าเลือก") return '<span class="chip y">รอลูกค้าเลือก</span>';
if(st === "รับเงินแล้ว") return '<span class="chip">รับเงินแล้ว</span>';
return '<span class="chip g">' + esc(st) + '</span>';
}
function schedule(first, days, n){
/* คำนวณวันเทรนจากวันที่เลือก + วันฝึก (ตรงกับที่หลังบ้านทำ) */
if(!first || !days.length || !n) return [];
var d = dateOf(first), out = [], guard = 0;
while(out.length < n && guard < 800){ if(days.indexOf(d.getDay()) >= 0) out.push(new Date(d)); d = addDays(d, 1); guard++; }
return out;
}
function pickForm(f, who){
/* f = ฟอร์มที่กำลังกรอก (pkgRow, program, days, first, name) ; who = "trainer" | "customer" */
var h = "";
var pks = S.packages || [];
if(!pks.length) h += '<div class="warn">ยังไม่มีแพ็กเกจในแท็บ "แพ็กเกจ" ของชีต เพิ่มแพ็กเกจก่อนนะครับ</div>';
h += '<div class="lbl">1 · เลือกแพ็กเกจ</div><div class="choice">';
pks.forEach(function(p){
h += '<button type="button" class="opt" data-a="pkg" data-v="' + p.row + '" aria-pressed="' + (f.pkgRow === p.row) + '"><div><div class="t">' + esc(p.name) + '</div><div class="s">' + p.n + ' ครั้ง' + (p.perWeek ? ' · สัปดาห์ละ ' + p.perWeek + ' วัน' : '') + (p.note ? ' · ' + esc(p.note) : '') + '</div></div><div class="pr">' + money(p.price) + '<div class="s" style="font-weight:400">บาท</div></div></button>';
});
h += '</div>';
h += '<div class="lbl">2 · เลือกโปรแกรม</div><select class="in" id="progSel" data-a="prog"><option value="">เลือกโปรแกรมจากคลัง</option>';
(S.programs || []).forEach(function(p){ h += '<option value="' + esc(p) + '"' + (f.program === p ? ' selected' : '') + '>' + esc(p) + '</option>'; });
h += '</select>';
if(who === "trainer") h += '<div class="sub" style="font-size:12px">ระบบใส่ท่าตามคลังโปรแกรมให้เลย แล้วณัฒปรับท่า/น้ำหนักต่อในชีตได้</div>';
h += '<div class="lbl">3 · วันที่สะดวกเทรน</div><div class="days">';
DORDER.forEach(function(i){ h += '<button type="button" class="day" data-a="day" data-v="' + i + '" aria-pressed="' + (f.days.indexOf(i) >= 0) + '">' + DSH[i] + '</button>'; });
h += '</div>';
var pk = pks.filter(function(p){ return p.row === f.pkgRow; })[0];
if(pk && pk.perWeek && f.days.length && f.days.length !== pk.perWeek) h += '<div class="sub" style="font-size:12px">แพ็กเกจนี้ออกแบบไว้สัปดาห์ละ ' + pk.perWeek + ' วัน เลือกต่างจากนี้ได้ ระบบจะนับครบตามจำนวนครั้ง</div>';
h += '<div class="lbl">4 · เริ่มเทรนตั้งแต่วันที่</div><input class="in" type="date" id="firstIn" data-a="first" min="' + esc(S.today) + '" value="' + esc(f.first) + '">';
var sc = pk ? schedule(f.first, f.days, pk.n) : [];
if(sc.length){
h += '<div class="sched">เริ่มเทรน <b style="color:var(--ink)">' + longDate(sc[0]) + '</b> · ครบ ' + pk.n + ' ครั้งประมาณ <b style="color:var(--ink)">' + longDate(sc[sc.length-1]) + '</b></div>';
}
if(pk){
h += '<div class="sum"><div class="kv"><span>แพ็กเกจ</span><b>' + esc(pk.name) + '</b></div><div class="kv"><span>จำนวน</span><b>' + pk.n + ' ครั้ง</b></div><div class="tot"><span>ยอดที่ต้องโอน</span><b>' + money(pk.price) + ' บาท</b></div></div>';
}
return h;
}
function pickReady(f, needName){
var pk = (S.packages || []).filter(function(p){ return p.row === f.pkgRow; })[0];
return !!(pk && f.program && f.days.length && f.first && (!needName || String(f.name || "").trim()));
}
function payBox(){
return S.pay ? '<div class="lbl">โอนเงินที่</div><div class="pay">' + esc(S.pay) + '</div>' : '<div class="warn">ณัฒจะส่งช่องทางโอนให้อีกครั้งครับ</div>';
}

/* ---------- ฝั่งเทรนเนอร์: หน้ารายการ ---------- */
function vTrainerList(){
var h = brand("โหมดเทรนเนอร์");
h += '<h1>ต่อคอร์ส / ลูกค้าใหม่</h1><p class="sub">ลูกค้าเลือกแพ็กเกจ ยืนยัน แล้วโอนเอง · ณัฒแค่กดรับยอดตอนเงินเข้า</p>';
h += '<button type="button" class="big" data-a="new">เริ่มทำรายการใหม่</button>';
if(!S.pay) h += '<div class="warn">ยังไม่ได้ใส่ช่องทางโอนเงิน · ใส่ที่แท็บ "แพ็กเกจ" ช่อง H2 ในชีต (ระบบจะแสดงให้ลูกค้าเห็น)</div>';
if(!(S.packages || []).length) h += '<div class="warn">ยังไม่มีแพ็กเกจในแท็บ "แพ็กเกจ" ของชีต</div>';
h += '<h2 style="margin-top:6px">รายการที่รอดำเนินการ</h2>';
if(!S.orders.length) h += '<div class="card sub">ยังไม่มีรายการค้าง · กด "เริ่มทำรายการใหม่" ได้เลย</div>';
S.orders.forEach(function(o){
var nm = o.name || "(ลูกค้าใหม่ ยังไม่ได้กรอกชื่อ)";
h += '<div class="card ord"><div class="top"><span class="nm">' + esc(nm) + '</span><span class="chip g">' + esc(o.kind) + '</span><span class="sp"></span>' + stChip(o.status) + '</div>';
if(o.pkg) h += '<div class="sub">' + esc(o.pkg) + ' · ' + o.n + ' ครั้ง · ' + money(o.price) + ' บาท' + (o.firstReal ? '<br>เริ่ม ' + esc(o.firstReal) + ' · ' + esc(o.prog) : '') + '</div>';
else h += '<div class="sub">ส่งลิงก์ให้ลูกค้าเลือกแล้ว รอลูกค้ากดยืนยัน</div>';
h += '<div class="acts">';

step = "pick"; return render();
}

if(a === "day"){ var i = W.days.indexOf(Number(v)); if(i >= 0) W.days.splice(i, 1); else W.days.push(Number(v)); return rerenderKeep(); }
if(a === "submit") return doCreate();
if(a === "custOk") return doCustOk();

if(action === "enrollCancel"){ dDb.orders = dDb.orders.filter(function(o){ return o.id !== v.id; }); return ok({ ok:true }); }
if(action === "enrollResend") return ok({ ok:true, sent:true, note:"ส่งไลน์ให้ลูกค้าแล้ว (เดโม)" });
if(action === "enrollCustConfirm"){ var pk2 = dDb.packages.filter(function(p){ return p.row === v.pkgRow; })[0]; return ok({ ok:true, pay:dDb.pay, order:{ id:"EN2", kind:"ลูกค้าใหม่", name:v.name, pkg:pk2.name, n:pk2.n, price:pk2.price, days:v.days.map(function(d){ return DOW[d]; }).join(" "), firstReal:"วันจันทร์ที่ 16 พ.ย.", status:"รอโอน" } }); }
return ok({ ok:false, error:"action" });
}
boot();
})();
